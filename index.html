<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="جميع روابط شَجَن في مكان واحد." />
  <meta name="theme-color" content="#6f7654" />
  <title>روابط شَجَن</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-background" id="pageBackground" aria-hidden="true"></div>

  <main class="link-page">
    <section class="profile-card" aria-labelledby="pageTitle">
      <img id="brandLogo" class="brand-logo hidden" alt="شعار شَجَن" />
      <div id="brandFallback" class="brand-fallback" aria-hidden="true">شَجَن</div>
      <h1 id="pageTitle">شَجَن</h1>
      <p id="pageBio">جميع روابطنا في مكان واحد</p>
    </section>

    <section id="linksContainer" class="links-container" aria-label="الروابط">
      <div class="loading-card">
        <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
        <span>جارٍ تحميل الروابط...</span>
      </div>
    </section>

    <footer id="pageFooter" class="page-footer">جميع الحقوق محفوظة لشَجَن</footer>
  </main>

  <noscript>
    <div class="noscript-message">يلزم تفعيل JavaScript لعرض الروابط.</div>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
