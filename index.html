<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="جميع روابط شَجَن في مكان واحد - يمكنكم التواصل معنا عبر">
  <meta name="theme-color" content="#ffffff">
  <title>شَجَن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      direction: rtl;
      background: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #2f3325;
      font-family: "Tajawal", sans-serif;
      display: flex;
      justify-content: center;
      padding: 44px 16px 28px;
    }

    .page {
      width: min(100%, 680px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      display: block;
      width: min(180px, 45vw);
      height: auto;
      margin: 0 auto 14px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      filter: drop-shadow(0 10px 16px rgba(60, 70, 42, 0.28));
    }

    .bio {
      margin: 4px 0 28px;
      font-size: 1.05rem;
      font-weight: 500;
      color: #454a3a;
      font-family: "Tajawal", sans-serif;
    }

    .links {
      width: 100%;
      display: grid;
      gap: 16px;
    }

    .link-button {
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      text-decoration: none;
      background: #a3b088; /* اللون الأخف المعتمد للبطاقات والأيقونات */
      color: #ffffff;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 1.02rem;
      font-weight: 700;
      font-family: "Tajawal", sans-serif;
      box-shadow: 0 8px 18px rgba(80, 90, 60, 0.12);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .link-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(80, 90, 60, 0.16);
    }

    .link-button:active {
      transform: translateY(0);
      opacity: .94;
    }

    .link-button:focus-visible {
      outline: 3px solid rgba(163, 176, 136, 0.35);
      outline-offset: 4px;
    }

    .icon {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: start;
    }

    .icon svg {
      width: 25px;
      height: 25px;
      display: block;
      fill: currentColor;
    }

    .label {
      grid-column: 2;
      text-align: center;
      direction: ltr;
      unicode-bidi: plaintext;
      font-family: "Tajawal", sans-serif;
    }

    .label.ar {
      direction: rtl;
    }

    .spacer {
      width: 28px;
      height: 28px;
      justify-self: end;
    }

    footer {
      margin-top: 30px;
      padding: 8px 0 2px;
      font-size: .92rem;
      font-weight: 600;
      color: #666b5c;
      font-family: "Tajawal", sans-serif;
    }

    @media (max-width: 480px) {
      body {
        padding: 30px 14px 22px;
      }

      .bio {
        margin-bottom: 22px;
      }

      .links {
        gap: 13px;
      }

      .link-button {
        min-height: 61px;
        border-radius: 20px;
        grid-template-columns: 40px 1fr 40px;
        padding: 9px 14px;
      }

      .icon,
      .spacer {
        width: 25px;
        height: 25px;
      }

      .icon svg {
        width: 23px;
        height: 23px;
      }
    }
  </style>
</head>
<body>

    </section>

    <footer>جميع الحقوق محفوظة لشَجَن</footer>
  </main>
</body>
</html>
